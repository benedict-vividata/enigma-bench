[project]
name = "enigma-bench"
version = "0.1.0"
description = "Enigma Bench — a time-boxed LLM agent benchmark: train a fixed-architecture transformer to decrypt Enigma ciphertext."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "benedict-vividata", email = "benedict@vividata.ai" }]
dependencies = [
    "mcp>=2.0.0,<3",
    "numpy>=2.1",
    "torch>=2.13,<3",
]

[project.optional-dependencies]
# Only needed on the *build* host that bakes the corpus into the image. The
# benchmark container never installs this (it has no internet at run time).
corpus = ["datasets>=4.0,<6", "zstandard>=0.23"]
# Installed into the container so the agent has the usual working kit offline.
# Keep this short: anything missing at run time cannot be installed.
agent = ["einops>=0.8", "matplotlib>=3.10", "tqdm>=4.67"]

[project.scripts]
enigma-bench = "enigma_bench.cli:main"
enigma-bench-mcp = "enigma_bench.mcp_server:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.16",
]

# ---------------------------------------------------------------------------
# torch resolution
#
# The benchmark host is an x86_64 Linux box with an NVIDIA GPU (e.g. a 4090),
# so pull the CUDA 12.9 build there. Everywhere else (arm64 dev containers,
# macOS) fall back to the PyPI wheel, which is CPU-only. That keeps `uv sync`
# working on a laptop while the image gets a real CUDA runtime.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu129", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = ["slow: exercises a full model forward pass or a large corpus"]
filterwarnings = ["error::DeprecationWarning:enigma_bench.*"]

[tool.coverage.run]
source = ["enigma_bench"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "SIM",       # simplify
    "PTH",       # pathlib
    "RUF",       # ruff-specific
    "ANN",       # annotations (mirrors the repo's TS explicit-return-type rule)
    "S",         # bandit
    "T20",       # no bare print outside the CLI
    "PL",        # pylint
]
ignore = [
    "PLR0913",   # many arguments: config-shaped constructors legitimately have them
    "PLR0917",   # ditto, for positional arguments
    "PLR2004",   # magic values: rife in cryptographic/tensor-shape code
    "S311",      # random.Random is used for *reproducible sampling*, never for secrets
    "PLC0415",   # deferred imports are deliberate: they keep torch off the import path
                 # of the torch-free modules (machine, tokenizer, tiers, dataset, runlog)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "ANN"]
"src/enigma_bench/cli.py" = ["T20"]
"scripts/*" = ["T20", "S101"]
"task/*" = ["T20", "PLR0915"]  # the starter trainer is a script: it prints and it is long

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true
